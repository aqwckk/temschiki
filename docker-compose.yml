---
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_UJIN_MODE: ${UJIN_MODE:-dry}
      TZ: "<+05>-5"
    volumes:
      - backend-data:/data
      - ${UJIN_CREDENTIALS:-./secrets/ujin.json}:/run/secrets/ujin.json:ro

  web:
    build:
      context: .
      dockerfile: mobile-prototype/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  backend-data:
